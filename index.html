<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonix Music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="glass">
  <main class="bubble">
    <button type="button" id="btn-like" class="btn-like" aria-label="Favoritar" aria-pressed="false">
      <svg class="icon-outline" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 21s-6.5-4.3-9-7.5C1.2 11.4 1.5 8 4 6.5 6.2 5.2 8.6 5.8 10 7.5L12 9.5l2-2c1.4-1.7 3.8-2.3 6-1 2.5 1.5 2.8 4.9 1 7C18.5 16.7 12 21 12 21z"/>
      </svg>
      <svg class="icon-filled" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 21s-6.5-4.3-9-7.5C1.2 11.4 1.5 8 4 6.5 6.2 5.2 8.6 5.8 10 7.5L12 9.5l2-2c1.4-1.7 3.8-2.3 6-1 2.5 1.5 2.8 4.9 1 7C18.5 16.7 12 21 12 21z"/>
      </svg>
    </button>
    <img
      id="cover"
      class="cover"
      src=""
      alt="Capa do album"
      width="96"
      height="96"
    />
    <section class="info">
      <h1 id="title" class="title">Nada tocando</h1>
      <p id="artist" class="artist">Abra o YouTube ou Spotify</p>
      <nav class="controls" aria-label="Controles de reproducao">
        <button type="button" id="btn-shuffle" class="btn-extra" aria-label="Aleatorio" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3h5v5M4 20l16-16M21 16v5h-5M15 15l6 6M4 4l5 5"/>
          </svg>
        </button>
        <button type="button" id="btn-prev" aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/>
          </svg>
        </button>
        <button type="button" id="btn-play" class="btn-play" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7L8 5z"/>
          </svg>
        </button>
        <button type="button" id="btn-next" aria-label="Proximo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2V6z"/>
          </svg>
        </button>
        <button type="button" id="btn-repeat" class="btn-extra" aria-label="Repetir" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
        </button>
      </nav>
      <div id="progress" class="progress" role="slider" tabindex="0" aria-label="Posicao da musica" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
      </div>
      <label class="volume">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 00-1.5-2.9v5.8a3.5 3.5 0 001.5-2.9z"/></svg>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" />
      </label>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
